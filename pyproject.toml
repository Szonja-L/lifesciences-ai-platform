[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lifesciences-platform"
version = "0.0.1"
description = "Life sciences AI and workflow automation portfolio platform (public or synthetic data only)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Szonja Lippert" }]
# Runtime dependencies are added by the task that first needs them (see CLAUDE.md rule 12).
dependencies = [
    "alembic>=1.14",            # versioned database schema migrations
    "fastapi>=0.115",           # web framework for the API
    "psycopg[binary]>=3.2",     # PostgreSQL driver (psycopg 3; binary wheels, no compiler on Windows)
    "pydantic-settings>=2.6",   # typed settings from the environment (pulls in pydantic)
    "sqlalchemy>=2.0",          # typed ORM and SQL toolkit (Mapped[] models)
    "uvicorn>=0.32",            # ASGI server that runs the app
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "httpx>=0.27",              # required by FastAPI's TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["src/lifesciences_platform"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Ruff can format code blocks inside Markdown; keep it away from the plan and prompts.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax for the target version
    "SIM", # simplifications
    "RUF", # ruff-specific rules
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "migrations"]
strict = true
# Relaxed so FastAPI route decorators and Pydantic/SQLAlchemy base classes
# do not produce noise later. Everything else in strict mode stays on.
disallow_untyped_decorators = false
disallow_subclassing_any = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "db: needs the PostgreSQL database (skipped when unreachable unless REQUIRE_DB=1)",
]
